[package]
name = "rustybros"
version = "0.1.0"
description = "Editor de video RustyBros"
edition = "2021"

[lib]
name = "rustybros_lib"
crate-type = ["rlib"]
test = false
doctest = false

[[bin]]
name = "rustybros"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[test]]
name = "processing"
path = "tests/processing.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
