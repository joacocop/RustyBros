name: Instaladores de escritorio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Dependencias de Linux y reproducción de video
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libgtk-3-dev gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - run: npm ci
      - run: npm run prepare:bundle
      - run: npm test
      - run: npm run test:rust
      - name: Generar instaladores nativos
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build
      - run: npm run collect:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: RustyBros-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
